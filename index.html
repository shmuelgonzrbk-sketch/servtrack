<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content"/>
  <meta name="theme-color" content="#1a2b40"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ServTrack"/>
  <title>ServTrack</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>

<div class="root" id="root">

  <!-- ═══════════════════════ HEADER ════════════════════════ -->
  <header class="header" id="header">
    <button class="hdr-menu" onclick="toggleDrawer()" aria-label="Menú">
      <div class="burger"><span></span><span></span><span></span></div>
    </button>
    <div class="hdr-center">
      <span class="hdr-title" id="hdrTitle">ServTrack</span>
    </div>
  </header>

  <!-- ═══════════════════════ DRAWER ════════════════════════ -->
  <div class="drawer-scrim" id="drawerScrim" onclick="closeDrawer()"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-app-name">ServTrack</div>
      <div class="drawer-app-sub">Tu asistente de campo</div>
    </div>
    <div class="drawer-nav">
      <div class="dnav-item active" id="dnav-home"          onclick="goTo('home')">
        <svg class="dnav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Inicio</span>
      </div>
      <div class="dnav-item" id="dnav-precursorado" onclick="goTo('precursorado')">
        <svg class="dnav-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
        <span>Precursorado</span>
      </div>
      <div class="dnav-item" id="dnav-informe"      onclick="goTo('informe')">
        <svg class="dnav-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        <span>Mi Informe</span>
      </div>
      <div class="dnav-item" id="dnav-asignaciones" onclick="goTo('asignaciones')">
        <svg class="dnav-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>Asignaciones</span>
      </div>
      <div class="dnav-item" id="dnav-history"      onclick="goTo('history')">
        <svg class="dnav-icon" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        <span>Historial</span>
      </div>
      <div class="dnav-item" id="dnav-settings"     onclick="goTo('settings')">
        <svg class="dnav-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 9.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>Ajustes</span>
      </div>
    </div>

    <!-- Solo en web: botón Play Store -->
    <div class="drawer-playstore" id="drawerPlayStore">
      <!-- 
        LINK PLAY STORE: cambia el href por tu URL cuando la tengas:
        href="https://play.google.com/store/apps/details?id=TU_PACKAGE"
      -->
      <a href="https://play.google.com/store/apps/details?id=com.servtrack.app" target="_blank" class="playstore-btn">
        <div class="playstore-btn-icon">
  <img src="img/playstore.png" width="32" height="32" alt="Play Store"/>
</div>
        <div class="playstore-btn-text">
          <span class="playstore-btn-sup">Disponible en</span>
          <span class="playstore-btn-title">Google Play</span>
        </div>
      </a>
      <!-- 
        ╔══════════════════════════════════════════════════╗
        ║  INSTRUCCIONES PLAY STORE                        ║
        ║  Cambia el href de arriba por tu link:           ║
        ║  https://play.google.com/store/apps/details?id= ║
        ║  + tu.package.name                              ║
        ╚══════════════════════════════════════════════════╝
      -->
    </div>
    <div class="drawer-version">v1.0.0 · ServTrack</div>
  </nav>

  <!-- ═══════════════════════ MAIN ══════════════════════════ -->
  <main class="main" id="main">

    <!-- ── HOME ── -->
    <section class="view active" id="view-home">
      <div class="home-stats">
        <div class="hstat"><span class="hstat-n" id="statR">0</span><span class="hstat-l">Revisitas</span></div>
        <div class="hstat-div"></div>
        <div class="hstat"><span class="hstat-n" id="statE">0</span><span class="hstat-l">Estudios</span></div>
        <div class="hstat-div"></div>
        <div class="hstat"><span class="hstat-n" id="statM">0</span><span class="hstat-l">Este mes</span></div>
      </div>

      <div class="search-bar">
        <svg class="search-ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar persona, dirección, notas…" oninput="onSearch(this.value)"/>
      </div>

      <div class="tabs-row">
        <button class="tab on" id="tab-all"      onclick="setTab('all')">Todos</button>
        <button class="tab"    id="tab-revisita"  onclick="setTab('revisita')">Revisitas</button>
        <button class="tab"    id="tab-estudio"   onclick="setTab('estudio')">Estudios</button>
        <button class="tab"    id="tab-hoy"       onclick="setTab('hoy')">Hoy</button>
      </div>

      <div class="card-list" id="cardList"></div>

      <button class="fab" id="fabBtn" onclick="openForm()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Agregar persona
      </button>
    </section>

    <!-- ── NOTIFICACIONES ── -->
    <section class="view slide" id="view-notifs">
      <div class="view-scroll" id="notifBody"></div>
    </section>

    <!-- ── PRECURSORADO ── -->
    <section class="view slide" id="view-precursorado">
      <div class="view-scroll" id="precBody"></div>
    </section>

    <!-- ── MI INFORME ── -->
    <section class="view slide" id="view-informe">
      <div class="view-scroll" id="informeBody"></div>
    </section>
    <!-- ── ASIGNACIONES ── -->
    <section class="view slide" id="view-asignaciones">
      <div class="view-scroll" id="asigBody"></div>
    </section>

    <!-- ── HISTORIAL ── -->
    <section class="view slide" id="view-history">
      <div class="view-scroll" id="histBody"></div>
    </section>

    <!-- ── AJUSTES ── -->
    <section class="view slide" id="view-settings">
      <div class="view-scroll" id="settingsBody"></div>
    </section>

  </main>

  <!-- ═══════════════════ FORM PANEL (slide up) ════════════ -->

        

        <!-- GPS -->

<div class="panel-bg" id="formBg">
  <div class="panel" id="formPanel">
    <div class="panel-bar"></div>
    <div class="panel-hdr">
      <span class="panel-title" id="formTitle">Nueva persona</span>
      <button class="panel-close" onclick="closeForm()">✕</button>
    </div>
    <div class="form-body">
      <div class="fgroup"><label id="lbl-nombre">Nombre completo *</label><input id="fNombre" type="text" placeholder="Nombre y apellido"/></div>
      <div class="fgroup"><label id="lbl-dir">Dirección</label><input id="fDir" type="text" placeholder="Calle, número, piso…"/></div>

      <!-- GPS -->
      <div class="fgroup">
        <label id="lbl-gps">Ubicación GPS</label>
        <div class="map-frame" id="mapFrame">
          <div class="map-empty" id="mapEmpty">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="opacity:.4"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            <span>Sin ubicación registrada</span>
          </div>
          <iframe id="mapIframe" class="map-iframe" style="display:none" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="map-btns" style="display:flex;gap:8px;margin-top:8px">
          <button onclick="captureGPS()" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 12px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            Registrar ubicación
          </button>
          <button onclick="openMapPicker()" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Buscar en el mapa
          </button>
          <button id="mapClearBtn" onclick="clearGPS()" style="display:none;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--tx3);font-size:13px;cursor:pointer;flex-shrink:0">✕</button>
        </div>
        <input type="hidden" id="fLat"/><input type="hidden" id="fLng"/>
      </div>

      <div class="fgroup"><label id="lbl-tel">Teléfono</label><input id="fTel" type="tel" placeholder="Número de contacto"/></div>
      <div class="fgroup"><label id="lbl-tipo">Tipo</label>
        <select id="fTipo"><option value="revisita" id="opt-revisita">Revisita</option><option value="estudio" id="opt-estudio">Estudio bíblico</option></select>
      </div>
      <div class="fgroup"><label id="lbl-pub">Publicación / Tema</label><input id="fPub" type="text" placeholder="Publicación o tema tratado"/></div>
      <div class="frow">
        <div class="fgroup"><label id="lbl-fecha">Próxima visita</label><input id="fFecha" type="date"/></div>
        <div class="fgroup"><label id="lbl-hora">Hora</label><input id="fHora" type="time"/></div>
      </div>
      <div class="fgroup"><label id="lbl-estado">Estado</label>
        <select id="fEstado">
          <option value="pendiente" id="opt-pendiente">Pendiente</option>
          <option value="interesado" id="opt-interesado">Interesado/a</option>
          <option value="regular" id="opt-regular">Estudio regular</option>
        </select>
      </div>
      <div class="fgroup"><label id="lbl-notas">Notas</label><textarea id="fNotas" placeholder="Observaciones, preguntas, temas de interés…"></textarea></div>

      <input type="hidden" id="fId"/>
      <button class="btn-save" id="saveBtn" onclick="saveCard()">Guardar</button>
      <button class="btn-cancel" onclick="closeForm()">Cancelar</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ ASIG FORM PANEL ════════════════════ -->
<div class="panel-bg" id="asigFormBg">
  <div class="panel" id="asigFormPanel">
  </div>
</div>

  <!-- ═══════════════════ DETALLE PANEL ════════════════════ -->
  <div class="panel-bg" id="detBg">
    <div class="panel" id="detPanel">
      <div class="panel-bar"></div>
      <div class="panel-hdr">
        <span class="panel-title" id="det-title">Detalle</span>
        <button class="panel-close" onclick="closeDet()">✕</button>
      </div>
      <div class="form-body" id="detBody"></div>
    </div>
  </div>

  <!-- input oculto JSON -->
  <input type="file" id="jsonInput" accept=".json" style="display:none" onchange="importJSON(this)"/>

</div><!-- /root -->


<!-- 1. Primero el store (no depende de nada) -->
<script src="./js/NotifStore.js"></script>
<script src="./js/CapacitorAdapter.js"></script>
<script src="./js/WebSWAdapter.js"></script>
<script src="./js/SetupNotificationChannel.js"></script>
<script src="./js/NotificationManager.js"></script>
<script src="./js/script.js"></script>



</body>
</html>
