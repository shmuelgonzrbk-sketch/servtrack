<div id="splashLoader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;
  background:
    radial-gradient(ellipse 500px 400px at 15% -5%, rgba(46,107,230,.10), transparent 60%),
    radial-gradient(ellipse 400px 350px at 100% 10%, rgba(160,102,10,.08), transparent 60%),
    linear-gradient(180deg, #faf9f7 0%, #f4f3f0 100%);">
  <div style="position:relative;width:72px;height:72px;margin-bottom:16px">
    <div style="position:absolute;inset:-10px;background:radial-gradient(circle, rgba(46,107,230,.18), transparent 70%);border-radius:50%;animation:splashOrb 4s ease-in-out infinite"></div>
    <img src="/img/logotipo.png" alt="AssendApp" style="position:relative;width:72px;height:72px;object-fit:contain">
  </div>
  <div style="font-family:'Playfair Display',serif;font-size:22px;color:#18170f;letter-spacing:-.3px">AssendApp</div>
  <div style="width:32px;height:32px;border:3px solid rgba(26,43,64,.15);border-top-color:#1a2b40;border-radius:50%;margin-top:24px;animation:spin .8s linear infinite"></div>
  <div id="splashMsg" style="margin-top:20px;opacity:0;transition:opacity .5s ease;text-align:center">
    <div id="splashTxt" style="font-size:13px;font-weight:600;color:#5c5a52;letter-spacing:-.1px"></div>
    <div id="splashSub" style="font-size:11px;color:#9c9a92;margin-top:4px"></div>
  </div>
</div>
<script>
(function(){
  var msgs = [
    { txt: 'Preparando todo para ti...', sub: 'Esto no tarda mucho' },
    { txt: 'Conectando con la nube...', sub: 'Sincronizando tus datos' },
    { txt: 'Ya casi estamos listos...', sub: 'Un momento mas' },
    { txt: 'Organizando tu ministerio...', sub: 'Cargando tus revisitas' },
    { txt: 'Cargando tu informacion...', sub: 'Todo seguro en la nube' },
    { txt: 'Casi listo...', sub: 'Gracias por tu paciencia' },
  ];
  var idx = 0;
  // Solo mostrar si tarda mas de 2 segundos
  var timer = setTimeout(function(){
    var el = document.getElementById('splashMsg');
    var txt = document.getElementById('splashTxt');
    var sub = document.getElementById('splashSub');
    if (!el || !txt) return;
    function show() {
      var m = msgs[idx % msgs.length];
      el.style.opacity = '0';
      setTimeout(function(){
        txt.textContent = m.txt;
        sub.textContent = m.sub;
        el.style.opacity = '1';
        idx++;
      }, 300);
    }
    show();
    setInterval(show, 3000);
  }, 2000);
  // Limpiar si carga rapido
  window.addEventListener('load', function(){ clearTimeout(timer); });
})();
</script>
<style>
  @keyframes spin{to{transform:rotate(360deg)}}

      <div class="fgroup"><label id="lbl-tipo">Tipo</label>
        <select id="fTipo"><option value="revisita" id="opt-revisita">Revisita</option><option value="estudio" id="opt-estudio">Estudio bíblico</option></select>
      </div>
      <div class="fgroup"><label id="lbl-pub">Publicación / Tema</label><input id="fPub" type="text" placeholder="Publicación o tema tratado"/></div>
      <div class="frow">
        <div class="fgroup"><label id="lbl-fecha">Próxima visita</label><input id="fFecha" type="date"/></div>
        <div class="fgroup"><label id="lbl-hora">Hora</label><input id="fHora" type="time"/></div>
      </div>
      <div class="fgroup"><label>Recordar</label>
        <select id="fRecordatorio">
          <option value="una_vez">Una vez</option>
          <option value="semanal">Cada semana</option>
        </select>
      </div>
      <div class="fgroup"><label id="lbl-estado">Estado</label>
        <select id="fEstado">
          <option value="pendiente" id="opt-pendiente">Pendiente</option>
          <option value="interesado" id="opt-interesado">Interesado/a</option>
          <option value="regular" id="opt-regular">Estudio regular</option>
        </select>
      </div>
      <div class="fgroup"><label id="lbl-notas">Notas</label><textarea id="fNotas" placeholder="Observaciones, preguntas, temas de interés…"></textarea></div>

      <div class="fgroup">
        <label>Color de etiqueta</label>
        <div class="pal-dots" id="fColorDots" style="margin-bottom:4px">
          <button type="button" onclick="seleccionarColorEtiqueta('f','#ff8a80')" class="cdot" data-c="#ff8a80" style="background:#ff8a80" title="Rojo suave"></button>
          <button type="button" onclick="seleccionarColorEtiqueta('f','#ffd54f')" class="cdot" data-c="#ffd54f" style="background:#ffd54f" title="Plátano"></button>
          <button type="button" onclick="seleccionarColorEtiqueta('f','#a5d6a7')" class="cdot" data-c="#a5d6a7" style="background:#a5d6a7" title="Verde claro"></button>
          <button type="button" onclick="seleccionarColorEtiqueta('f','#90caf9')" class="cdot" data-c="#90caf9" style="background:#90caf9" title="Azul suave"></button>
          <button type="button" onclick="seleccionarColorEtiqueta('f','#ce93d8')" class="cdot" data-c="#ce93d8" style="background:#ce93d8" title="Morado suave"></button>
          <button type="button" onclick="seleccionarColorEtiqueta('f','#ffab91')" class="cdot" data-c="#ffab91" style="background:#ffab91" title="Durazno"></button>
          <button type="button" onclick="seleccionarColorEtiqueta('f','#80cbc4')" class="cdot" data-c="#80cbc4" style="background:#80cbc4" title="Turquesa"></button>
        </div>
        <input type="hidden" id="fColor" value=""/>
      </div>

      <input type="hidden" id="fId"/>
      <button class="btn-save" id="saveBtn" onclick="saveCard()">Guardar</button>
      <button class="btn-cancel" onclick="smartCloseForm()">Cancelar</button>
    </div>
  </div>
</div>
